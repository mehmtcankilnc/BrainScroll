name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "shared/**"
      - "iosApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "shared/**"
      - "iosApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for simulator
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS app without signing
        run: >
          xcodebuild build
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64
          CODE_SIGNING_ALLOWED=NO

  testflight:
    name: Upload to TestFlight
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 60
    environment: testflight
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$APPSTORE_API_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${APPSTORE_KEY_ID}.p8"

      # The archive is signed ad hoc ("-"), not with a real certificate: a development profile would need a
      # registered device, which TestFlight does not need. Ad hoc signing still embeds the entitlements
      # (Sign in with Apple) into the binary; a fully unsigned archive drops them and Apple login fails with
      # error 1000. The export step then re-signs with the real distribution profile.
      - name: Archive
        run: >
          xcodebuild archive
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/BrainScroll.xcarchive"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY="-"
          CODE_SIGNING_ALLOWED=YES
          CODE_SIGNING_REQUIRED=NO
          PROVISIONING_PROFILE_SPECIFIER=""
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      # Information only (it never stops the upload): shows which entitlements the archive carries. The archive is
      # unsigned, so this is where we can see whether "Sign in with Apple" made it in before the export step signs it.
      - name: Show entitlements in the archive
        continue-on-error: true
        run: |
          ARCHIVE="$RUNNER_TEMP/BrainScroll.xcarchive"
          APP=$(find "$ARCHIVE/Products" -maxdepth 3 -name "*.app" | head -1)
          echo "App bundle: $APP"
          echo "--- entitlement files in the archive ---"
          find "$ARCHIVE" -name "*.xcent" -print -exec cat {} \;
          echo "--- entitlements embedded in the binary ---"
          codesign -d --entitlements :- "$APP" 2>&1 || true
          if find "$ARCHIVE" -name "*.xcent" -exec grep -l "com.apple.developer.applesignin" {} + | grep -q .; then
            echo "OK: the Sign in with Apple entitlement is in the archive."
          else
            echo "::warning::The Sign in with Apple entitlement is NOT in the archive. Apple sign-in will fail on devices."
          fi

      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Export and upload to TestFlight
        run: >
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/BrainScroll.xcarchive"
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          -exportPath "$RUNNER_TEMP/export"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          -authenticationKeyID "$APPSTORE_KEY_ID"
          -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
